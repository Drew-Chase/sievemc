[workspace]
resolver = "3"
members = ["crates/lib", "crates/cli", "crates/desktop/src-tauri"]

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
opt-level = "s"

[workspace.dependencies]
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }
zip = {version = "8.6.0"}
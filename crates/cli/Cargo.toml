[package]
name = "sievemc_cli"
version = "0.0.0"
edition = "2024"
rust-version = "1.90.0"
description = "CLI tool for filtering Minecraft mod JARs by side (client, server, or both) into directories or zip archives"
authors = ["Drew Chase"]
license = "MIT"
repository = "https://github.com/drew-chase/sievemc"
homepage = "https://github.com/drew-chase/sievemc"
keywords = ["minecraft", "modpack", "mods", "cli", "filter"]
categories = ["command-line-utilities", "game-development"]
readme = "../../README.md"

[dependencies]
sievemc = { package = "sievemc_lib", path = "../lib" }
clap = { version = "4.6.4", default-features = false, features = ["std", "color", "error-context", "help", "string", "suggestions", "usage", "wrap_help", "derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
color-eyre = { version = "0.6.5", features = ["tracing-error"] }
zip = { workspace = true }
[package]
name = "sievemc_cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"

[dependencies]
sievemc = { package = "sievemc_lib", path = "../lib" }
clap = { version = "4.6.4", default-features = false, features = ["std", "color", "error-context", "help", "string", "suggestions", "usage", "wrap_help", "derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
color-eyre = { version = "0.6.5", features = ["tracing-error"] }
zip = { workspace = true }
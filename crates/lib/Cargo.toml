[package]
name = "sievemc_lib"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
description = "Utility functions to help filter and determine the side of a mod file (client, server, or both)"

[lib]
name="sievemc"
path="src/lib.rs"

[dependencies]
zip = {version = "8.6.0"}
serde = {version = "1.0.229", features = ["derive"]}
serde_json = {version = "1.0.151"}
toml = {version = "1.1.3+spec-1.1.0", features = ["serde"]}
thiserror = {version = "2.0.19"}
rayon = {version = "1.12.0"}
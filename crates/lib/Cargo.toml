[package]
name = "sievemc_lib"
version = "0.2.0"
edition = "2024"
rust-version = "1.90.0"
description = "Utility functions to detect and filter Minecraft mod JARs by side (client, server, or both)"
authors = ["Drew Chase"]
license = "MIT"
repository = "https://github.com/drew-chase/sievemc"
homepage = "https://github.com/drew-chase/sievemc"
documentation = "https://docs.rs/sievemc_lib"
keywords = ["minecraft", "modpack", "mods", "fabric", "forge"]
categories = ["game-development", "filesystem"]
readme = "../../README.md"

[lib]
name = "sievemc"
path = "src/lib.rs"

[dependencies]
zip = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151" }
toml = { version = "1.1.3+spec-1.1.0", features = ["serde"] }
thiserror = { version = "2.0.19" }
rayon = { version = "1.12.0" }
tracing = { workspace = true }